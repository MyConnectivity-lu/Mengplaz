<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MengPlaz Sign In</title>

  <style>
    :root {
      --color-bg: #0f172a;
      --color-card: #1e293b;
      --color-primary: #04e104;
      --color-secondary: #10069f;
      --color-tertiary: #ff18a4;
      --color-border: #334155;
      --color-text: #f1f5f9;
      --color-error: #f74318;
      --color-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.5);
      --border-radius-lg: 0.75rem;
      --border-radius-sm: 0.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    }

    /* Base Styles */
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      margin: 0;
    }

    /* Main Container */
    #container {
      width: 100%;
      max-width: 448px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo/Title */
    #logo {
      font-size: 2.25rem;
      font-weight: 800;
      color: var(--color-primary);
      margin-bottom: 1.5rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Login Card */
    #login {
      width: 100%;
      background-color: var(--color-card);
      padding: 1.5rem;
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--color-shadow);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Form Labels */
    label {
      display: flex;
    }

    /* Input Fields */
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--color-bg);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--border-radius-sm);
      outline: none;
      transition: border-color 150ms ease-in-out, box-shadow 150ms ease-in-out;
      appearance: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 1px var(--color-primary);
    }

    /* Button Container for secondary actions */
    #secondary-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding-top: 0.5rem;
    }

    /* Base Button Styles (using shared class) */
    button {
      width: 100%;
      padding: 0.75rem 1rem;
      font-weight: 600;
      border-radius: var(--border-radius-sm);
      transition: all 150ms ease-in-out;
      cursor: pointer;
      text-align: center;
      appearance: none;
      line-height: 1;
      /* Match implicit button sizing */
    }

    /* Primary Button (Sign in) */
    #signin {
      background-color: var(--color-primary);
      color: #1a202c;
      border: none;
    }

    #signin:hover {
      opacity: 0.9;
    }

    #signin:active {
      transform: scale(0.99);
    }

    #signin:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
    }

    /* Inverse/Secondary Button (Sign out) */
    #signout {
      padding: 0.5rem 1rem;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
      background-color: transparent;
    }

    #signout:hover {
      background-color: rgba(4, 225, 4, 0.1);
    }

    #signout:active {
      transform: scale(0.99);
    }

    /* Tertiary Button (OpenID) */
    #oid {
      padding: 0.5rem 1rem;
      color: var(--color-tertiary);
      border: 1px solid var(--color-tertiary);
      background-color: transparent;
    }

    #oid:hover {
      background-color: rgba(255, 24, 164, 0.1);
    }

    #oid:active {
      transform: scale(0.99);
    }

    /* Result/Error Message */
    #result {
      display: none;
      font-size: 0.875rem;
      text-align: center;
      font-weight: 500;
      color: var(--color-error);
      padding-top: 0.5rem;
    }

    /* Footer */
    #footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      text-align: center;
      color: var(--color-text);
    }

    #footer a {
      color: var(--color-tertiary);
      text-decoration: none;
      transition: text-decoration 150ms ease-in-out;
    }

    #footer a:hover {
      text-decoration: underline;
    }

    /* Media Query for larger screens (md:p-8) */
    @media (min-width: 768px) {
      #login {
        padding: 2rem;
      }
    }
  </style>
</head>

<body>
  <main id="container">
    <h2 id="logo">MengPlaz</h2>
    <div id="login">
      <label for="username">
        <input id="username" type="text" name="username" placeholder="Username" required="required"
          autocomplete="username" />
      </label>
      <label for="password">
        <input id="password" type="password" name="password" placeholder="Password" required="required"
          autocomplete="current-password" />
      </label>
      <button id="signin">Sign in</button>
      <button id="signout">Sign out</button>
      <button id="oid">
        OpenID Sign-in
      </button>
      <div id="result"></div>
    </div>
    <div id="footer">
      <p>
        &copy; 2025&nbsp;
        <a href="https://myconnectivity.lu/" target="_blank">
          MyConnectivity G.I.E.
        </a><br />
        &nbsp;— Powered by&nbsp;
        <a href="https://greycat.io" target="_blank">
          GreyCat
        </a>
      </p>
    </div>
  </main>
</body>

<script type="module">
  /** @type {HTMLDivElement} */
  const resultEl = document.getElementById('result');
  /** @type {HTMLInputElement} */
  const usernameEl = document.getElementById('username');
  /** @type {HTMLInputElement} */
  const passwordEl = document.getElementById('password');
  /** @type {HTMLButtonElement} */
  const signinEl = document.getElementById('signin');
  /** @type {HTMLButtonElement} */
  const signoutEl = document.getElementById('signout');
  /** @type {HTMLButtonElement} */
  const oidEl = document.getElementById('oid');
  const params = new URLSearchParams(window.location.search);

  // hide some by default
  signoutEl.style.display = 'none';
  oidEl.style.display = params.has('no_sso') ? 'block' : 'none';

  function resetErrHandler() {
    resultEl.style.display = 'none';
    resultEl.textContent = '';
  }

  function resultText(txt) {
    resultEl.style.display = 'block';
    resultEl.textContent = txt;
  }

  function missingWebPerm() {
    resultText("Missing 'web' permission");
    // hide login
    signinEl.style.display = 'none';
    usernameEl.style.display = 'none';
    passwordEl.style.display = 'none';
    signinEl.style.display = 'none';
    oidEl.style.display = 'none';
    // show logout
    signoutEl.style.display = 'block';
  }

  /**
   *
   * @param {KeyboardEvent} e
   */
  function keypressHandler(e) {
    resetErrHandler();
    // if 'Enter' pressed, try to log in
    if (e.key === 'Enter') {
      auth();
    }
  }

  /**
   * This function basically does: `hex(sha256(data))`
   *
   * Generates SHA-256 hash of string
   *
   * @param {string} data               string to be hashed
   * @param {boolean} utf8encode encode data as UTF-8 before generating hash (defaults to `true`)
   * @returns {string}                  hash of data as hex character string
   */
  function sha256hex(data, utf8encode = true) {
    const c = {};
    c.hash = function (a, f) {
      ('undefined' == typeof f || f) && (a = t(a));
      for (
        var h = [
          1116352408, 1899447441, 3049323471, 3921009573, 961987163, 1508970993, 2453635748,
          2870763221, 3624381080, 310598401, 607225278, 1426881987, 1925078388, 2162078206,
          2614888103, 3248222580, 3835390401, 4022224774, 264347078, 604807628, 770255983,
          1249150122, 1555081692, 1996064986, 2554220882, 2821834349, 2952996808, 3210313671,
          3336571891, 3584528711, 113926993, 338241895, 666307205, 773529912, 1294757372,
          1396182291, 1695183700, 1986661051, 2177026350, 2456956037, 2730485921, 2820302411,
          3259730800, 3345764771, 3516065817, 3600352804, 4094571909, 275423344, 430227734,
          506948616, 659060556, 883997877, 958139571, 1322822218, 1537002063, 1747873779,
          1955562222, 2024104815, 2227730452, 2361852424, 2428436474, 2756734187, 3204031479,
          3329325298,
        ],
        b = [
          1779033703, 3144134277, 1013904242, 2773480762, 1359893119, 2600822924, 528734635,
          1541459225,
        ],
        a = a + String.fromCharCode(128),
        i = Math.ceil((a.length / 4 + 2) / 16),
        j = Array(i),
        g = 0;
        g < i;
        g++
      ) {
        j[g] = Array(16);
        for (var e = 0; 16 > e; e++)
          j[g][e] =
            (a.charCodeAt(64 * g + 4 * e) << 24) |
            (a.charCodeAt(64 * g + 4 * e + 1) << 16) |
            (a.charCodeAt(64 * g + 4 * e + 2) << 8) |
            a.charCodeAt(64 * g + 4 * e + 3);
      }
      j[i - 1][14] = (8 * (a.length - 1)) / Math.pow(2, 32);
      j[i - 1][14] = Math.floor(j[i - 1][14]);
      j[i - 1][15] = (8 * (a.length - 1)) & 4294967295;
      for (var e = Array(64), k, m, n, q, l, o, p, r, g = 0; g < i; g++) {
        for (var d = 0; 16 > d; d++) e[d] = j[g][d];
        for (d = 16; 64 > d; d++)
          e[d] = (c.h(e[d - 2]) + e[d - 7] + c.g(e[d - 15]) + e[d - 16]) & 4294967295;
        k = b[0];
        m = b[1];
        n = b[2];
        q = b[3];
        l = b[4];
        o = b[5];
        p = b[6];
        r = b[7];
        for (d = 0; 64 > d; d++) {
          var s = r + c.f(l) + c.c(l, o, p) + h[d] + e[d],
            u = c.e(k) + c.d(k, m, n);
          r = p;
          p = o;
          o = l;
          l = (q + s) & 4294967295;
          q = n;
          n = m;
          m = k;
          k = (s + u) & 4294967295;
        }
        b[0] = (b[0] + k) & 4294967295;
        b[1] = (b[1] + m) & 4294967295;
        b[2] = (b[2] + n) & 4294967295;
        b[3] = (b[3] + q) & 4294967295;
        b[4] = (b[4] + l) & 4294967295;
        b[5] = (b[5] + o) & 4294967295;
        b[6] = (b[6] + p) & 4294967295;
        b[7] = (b[7] + r) & 4294967295;
      }
      return (
        c.b(b[0]) + c.b(b[1]) + c.b(b[2]) + c.b(b[3]) + c.b(b[4]) + c.b(b[5]) + c.b(b[6]) + c.b(b[7])
      );
    };
    c.a = function (a, f) {
      return (f >>> a) | (f << (32 - a));
    };
    c.e = function (a) {
      return c.a(2, a) ^ c.a(13, a) ^ c.a(22, a);
    };
    c.f = function (a) {
      return c.a(6, a) ^ c.a(11, a) ^ c.a(25, a);
    };
    c.g = function (a) {
      return c.a(7, a) ^ c.a(18, a) ^ (a >>> 3);
    };
    c.h = function (a) {
      return c.a(17, a) ^ c.a(19, a) ^ (a >>> 10);
    };
    c.c = function (a, f, h) {
      return (a & f) ^ (~a & h);
    };
    c.d = function (a, f, h) {
      return (a & f) ^ (a & h) ^ (f & h);
    };
    c.b = function (a) {
      for (var f = '', h, b = 7; 0 <= b; b--) (h = (a >>> (4 * b)) & 15), (f += h.toString(16));
      return f;
    };

    function t(a) {
      a = a.replace(/[\u0080-\u07ff]/g, function (a) {
        a = a.charCodeAt(0);
        return String.fromCharCode(192 | (a >> 6), 128 | (a & 63));
      });
      return (a = a.replace(/[\u0800-\uffff]/g, function (a) {
        a = a.charCodeAt(0);
        return String.fromCharCode(224 | (a >> 12), 128 | ((a >> 6) & 63), 128 | (a & 63));
      }));
    }

    return c.hash(data, utf8encode);
  }

  // detect prefix
  let prefix = ".";
  for (let i = 0; i < 4; i++) {
    const response = await fetch(`${prefix}/runtime::Identity::current_id`, { method: 'POST' });
    if (response.status === 401) {
      break;
    }
    prefix += '/..';
  }

  async function auth_desktop() {
    const password = await window.greycat_desktop_password();
    try {
      const credentials = btoa(`root:${sha256hex(password)}`);
      const res = await fetch(`${prefix}/runtime::Identity::login`, {
        method: 'POST',
        body: JSON.stringify([credentials, true])
      });
      if (res.ok) {
        const url = new URL(window.location.href.toString());
        url.hash = '';
        window.location.replace(url.toString()?.replace("login.html", ""));
      } else {
        resultText('Login rejected');
      }
    } catch (err) {
      console.error(err);
      resultText('Login failed');
    }
  }

  async function auth() {
    try {
      const credentials = btoa(`${usernameEl.value}:${sha256hex(passwordEl.value)}`);
      const res = await fetch(`${prefix}/runtime::Identity::login`, {
        method: 'POST',
        body: JSON.stringify([usernameEl.value, sha256hex(passwordEl.value)])
      });
      if (res.ok) {
        const url = new URL(window.location.href.toString());
        url.hash = '';
        window.location.replace(url.toString()?.replace("login.html", ""));
      } else {
        resultText('Login rejected');
      }
    } catch (err) {
      console.error(err);
      resultText('Login failed');
    }
  }

  async function start_open_id() {
    const oid_params = new URLSearchParams(window.location.hash.replace('#', '?'));
    const token = oid_params.get('id_token');
    if (token) {
      const response = await fetch(`${prefix}/runtime::Identity::tokenLogin`, {
        method: 'POST',
        body: JSON.stringify([token, true])
      });
      if (response.ok) {
        const res = await fetch(`${prefix}/runtime::Identity::permissions`, { method: 'POST' });
        const permissions = await res.json();
        if (!permissions.includes('web')) {
          missingWebPerm();
        } else {
          const url = new URL(window.location.href.toString());
          url.hash = '';
          window.location.replace(url.toString()?.replace("login.html", ""));
        }
      } else {
        resultText('Login rejected');
      }
    } else {
      const response = await fetch(`${prefix}/runtime::OpenIDConnect::config`, { method: 'POST' });
      if (response.ok) {
        const open_id_config = await response.json();
        if (open_id_config != null && open_id_config.url !== null) {
          const response_oid_infos = await fetch(open_id_config.url);
          if (response_oid_infos.ok) {
            const oid_infos = await response_oid_infos.json();
            if (oid_infos != null && oid_infos.authorization_endpoint !== null) {
              const redirect_uri = new URL(window.location.href);
              redirect_uri.hash = '';
              redirect_uri.search = '';

              const auth_url = new URL(oid_infos.authorization_endpoint);
              auth_url.searchParams.append('response_type', 'id_token');
              auth_url.searchParams.append('scope', 'openid email');
              auth_url.searchParams.append('response_mode', 'fragment');
              auth_url.searchParams.append('state', '12345');
              auth_url.searchParams.append('nonce', '678910');
              auth_url.searchParams.append('client_id', open_id_config.clientId);
              auth_url.searchParams.append('redirect_uri', redirect_uri.toString());

              localStorage.setItem('redirect_uri', redirect_uri.toString());
              localStorage.setItem('auth_url', auth_url.toString());
              window.location.replace(auth_url);
            }
          }
        }
      }
    }
  }

  async function signout() {
    await fetch(`${prefix}/runtime::Identity::logout`, { method: 'POST' });
    window.location.reload();
  }

  if (window.greycat_desktop_password !== undefined) {
    auth_desktop();
  } else if (!params.has('no_sso')) {
    start_open_id();
  }

  usernameEl.addEventListener('keypress', keypressHandler);
  usernameEl.addEventListener('focus', resetErrHandler);
  passwordEl.addEventListener('keypress', keypressHandler);
  passwordEl.addEventListener('focus', resetErrHandler);
  signinEl.addEventListener('click', auth);
  signinEl.addEventListener('focus', resetErrHandler);
  signoutEl.addEventListener('click', signout);
  oidEl.addEventListener('click', start_open_id);
  oidEl.addEventListener('focus', resetErrHandler);

</script>

</html>
